<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Drum</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="main">
      <div class="overlay"></div>
      <div class="key" data-key="65"><span>A</span></div>
      <div class="key" data-key="83"><span>S</span></div>
      <div class="key" data-key="68"><span>D</span></div>
      <div class="key" data-key="70"><span>F</span></div>
      <div class="key" data-key="71"><span>G</span></div>
      <div class="key" data-key="72"><span>H</span></div>
      <div class="key" data-key="74"><span>J</span></div>
      <div class="key" data-key="75"><span>K</span></div>
      <div class="key" data-key="76"><span>L</span></div>
    </div>
    <audio data-key="65" src="clap.mp3"></audio>
    <audio data-key="83" src="Hihat.mp3"></audio>
    <audio data-key="68" src="kick.mp3"></audio>
    <audio data-key="70" src="openhat.mp3"></audio>
    <audio data-key="71" src="boom.mp3"></audio>
    <audio data-key="72" src="ride.mp3"></audio>
    <audio data-key="74" src="snare.mp3"></audio>
    <audio data-key="75" src="tom drum.mp3"></audio>
    <audio data-key="76" src="tink.mp3"></audio>

    <script>
      function playSound(e) {
        const audio = document.querySelector(
          `audio[data-key = "${e.keyCode}"]`,
        );
        const key = document.querySelector(`.key[data-key = "${e.keyCode}"]`);
        if (!audio) return;
        audio.currentTime = 0;
        audio.play();
        key.classList.add("playing");
      }
      function removeTransition(e) {
        if (e.propertyName !== "transform") return;
        e.target.classList.remove("playing");
      }
      const key = document.querySelectorAll(".key");
      key.forEach((e) => {
        e.addEventListener("transitionend", removeTransition);
      });
      window.addEventListener("keydown", playSound);
    </script>
  </body>
</html>
